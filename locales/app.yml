# ---- 规则 ----
rules.title:
  en: Rules
  zh-CN: 规则
rules.tiles.h:
  en: Tiles
  zh-CN: 牌
rules.tiles:
  en: "Characters, bamboo and dots only, 108 tiles in all. No chow: only pung and kong."
  zh-CN: 只有万、条、筒，共 108 张；不能吃，只能碰和杠。
rules.void.h:
  en: Void suit
  zh-CN: 定缺
rules.void:
  en: "At the start each player gives up one suit and must discard it first; you cannot win while holding it."
  zh-CN: 开局选一门不要的花色，先打完它；手里有缺门的牌不能胡。
rules.blood.h:
  en: Blood battle
  zh-CN: 血战
rules.blood:
  en: "A player who wins leaves the table and the rest play on until one is left or the wall runs out. One discard can win for several players."
  zh-CN: 一家胡了就离场，其余继续，直到只剩一家或牌摸完。一炮可以多响。
rules.chips.h:
  en: Chips
  zh-CN: 筹码
rules.chips:
  en: "Everyone starts with 5,000; the base stake is 10. A basic hand pays 10 and each fan doubles it, up to 5 fan (320). A self-drawn win is paid by all three."
  zh-CN: 每人本金 5,000，底注 10。平胡 10，每番翻倍，最多 5 番（320）。自摸三家都给。
rules.fan.h:
  en: Fan
  zh-CN: 番型
rules.fan:
  en: "Pure suit 2, all pungs 1, all 2-5-8 pungs 3, seven pairs 2, terminals in every set 2, golden hook 1, and 1 for each root (four of a kind)."
  zh-CN: 清一色 2、对对胡 1、将对 3、七对 2、带幺九 2、金钩钓 1，每个根（四张一样）1。
rules.bonus.h:
  en: Bonus fan
  zh-CN: 加番
rules.bonus:
  en: "Self-drawn, win after a kong, win on a kong discard, robbing a kong, last tile drawn and last tile discarded: 1 fan each."
  zh-CN: 自摸、杠上开花、杠上炮、抢杠胡、海底捞月、海底炮，各 1 番。
rules.wind.h:
  en: Wind and rain
  zh-CN: 刮风下雨
rules.wind:
  en: "A concealed kong takes 20 from each player, an added kong 10 from each, and an exposed kong 20 from whoever discarded the tile."
  zh-CN: 暗杠每家给 20，补杠每家给 10，直杠由放杠的人给 20。
rules.draw.h:
  en: Drawn round
  zh-CN: 流局
rules.draw:
  en: "Anyone still holding their void suit pays every player 320. Anyone not ready pays each ready player the most they could have won."
  zh-CN: 查花猪：手里还有缺门的赔每家 320。查大叫：没听牌的赔听牌的人他能胡的最大番。
rules.source:
  en: Source and downloads
  zh-CN: 源代码与下载
rules.ok:
  en: Got it
  zh-CN: 知道了

